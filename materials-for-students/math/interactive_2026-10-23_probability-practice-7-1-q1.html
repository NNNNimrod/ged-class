<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ged-students" content="S001">
<title>Lesson 7 Probability, page 297, problems 1, walkthrough</title>
<link rel="stylesheet" href="interactive-player.css?v=stack20">
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<script defer src="interactive-player.js?v=stack20"></script>
</head>
<body>
<div id="iw-app"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  /* Color roles (locked):
     term-fav green  = 20, favorable, numerator, 2 in 2/5
     term-tot blue   = 50, total, denominator, 5 in 2/5
     term-dec amber  = 0.4 decimal form
     term-pct pink   = 40% percent form
  */
  var C_FAV = '#0f7a3d', C_TOT = '#1d4ed8';
  var C_FAV_MATH = '0f7a3d', C_TOT_MATH = '1d4ed8';
  var F = function (h) { return '<strong class="iw-term iw-term-fav">' + h + '</strong>'; };
  var Tot = function (h) { return '<strong class="iw-term iw-term-tot">' + h + '</strong>'; };
  var Dec = function (h) { return '<strong class="iw-term iw-term-dec">' + h + '</strong>'; };
  var Pct = function (h) { return '<strong class="iw-term iw-term-pct">' + h + '</strong>'; };

  /** Stacked MathJax fraction (on-screen). Voice still says "two fifths" etc. */
    // Stacked colored fractions via HTML (avoid MathJax \\color / # issues)
  function sf(num, den, cNum, cDen) {
    // cNum/cDen ignored for class mapping; use fav/tot semantic classes
    return '<span class="iw-stack-frac" role="img" aria-label="' + num + ' over ' + den + '">' +
      '<span class="iw-stack-num iw-term iw-term-fav">' + num + '</span>' +
      '<span class="iw-stack-bar" aria-hidden="true"></span>' +
      '<span class="iw-stack-den iw-term iw-term-tot">' + den + '</span></span>';
  }
  function sfText(numT, denT) {
    return '<span class="iw-stack-frac iw-stack-frac-text" role="img" aria-label="' + numT + ' over ' + denT + '">' +
      '<span class="iw-stack-num iw-term iw-term-fav">' + numT + '</span>' +
      '<span class="iw-stack-bar" aria-hidden="true"></span>' +
      '<span class="iw-stack-den iw-term iw-term-tot">' + denT + '</span></span>';
  }
function row() {
    return '<div class="iw-frac-work-row">' + Array.prototype.slice.call(arguments).join('') + '</div>';
  }
  function col() {
    return '<div class="iw-frac-work-col">' + Array.prototype.slice.call(arguments).join('') + '</div>';
  }
  function eq() { return '<span class="iw-frac-eq" aria-hidden="true">=</span>'; }
  function op(s) { return '<span class="iw-frac-op" aria-hidden="true">' + s + '</span>'; }

  var problemHtml =
    '<p><strong>Problem 1: the vowel tiles</strong></p>' +
    '<p>In a word game there are ' + Tot('50') + ' wooden letter tiles in all. ' +
    F('20') + ' of them have a vowel on them. You pull out one tile without looking. What\'s the chance it shows a vowel?</p>' +
    '<span class="iw-nocalc">✋ By hand. No calculator.</span>';

  var frac2050 = sf('20', '50');
  var frac25 = sf('2', '5');
  var frac410 = sf('4', '10');
  var frac40100 = sf('40', '100');
  var fracMid = sf('20\\div 10', '50\\div 10');
  var fracUpside = '<span class="iw-stack-frac" role="img" aria-label="50 over 20">' +'<span class="iw-stack-num iw-term iw-term-tot">50</span>' +'<span class="iw-stack-bar" aria-hidden="true"></span>' +'<span class="iw-stack-den iw-term iw-term-fav">20</span></span>';
  var fracWant = sfText('what you want', 'all the chances');
  var fracFavPoss = sfText('favorable', 'possible');

  var slides = [
    {
      kind: 'title',
      kicker: 'Interactive walkthrough',
      title: 'Lesson 7 Probability, page 297, problems 1, walkthrough',
      accent: '#1a1a2e',
      whyBg: '#ececf3',
      body:
        '<div class="iw-goal"><strong>The big idea:</strong> probability is a ratio (the part you want compared with the total).' +
        '<p style="margin:.6em 0 0;text-align:center;font-size:1.15em">probability = ' + fracWant + '</p>' +
        'It is always a number from 0 (it can\'t happen) to 1 (it will surely happen).</div>' +
        '<p>You\'ll write the answer three ways: as a <strong>fraction</strong>, a <strong>decimal</strong>, and a <strong>percent</strong>.</p>' +
        '<p style="margin-top:12px;color:var(--muted);font-size:.92em">Matching colors (bold) track ' + F('favorable') + ' and ' + Tot('total') + ' across the page. Tap <strong>Next</strong> after each step.</p>',
      why: 'Probability is a ratio from 0 to 1. Writing it three ways (fraction, decimal, percent) is the same amount of pizza, different slice sizes.',
      voice: 'Lesson 7 Probability, page 297, problem 1. Probability is what you want over all the chances. We will write the answer as a fraction, a decimal, and a percent. Do this by hand. The problem stays on the left. Tap Next after each step.'
    },
    {
      kind: 'step',
      kicker: 'Look at the problem',
      title: 'Read the whole problem once',
      accent: '#1a1a2e',
      body:
        '<p>The original problem is pinned on the left so you can glance back anytime.</p>' +
        '<p>Find the two numbers you\'ll need: how many <strong>vowels</strong> (' + F('20') + '), and how many tiles <strong>in all</strong> (' + Tot('50') + ').</p>',
      why: 'Read the whole problem once before touching numbers. The numbers you need are already sitting in the sentence.',
      voice: 'Read the whole problem once. It stays pinned on the left. Find how many vowels and how many tiles in all.',
      work: '<em>Read</em>: ' + F('vowels') + ' and ' + Tot('total')
    },
    {
      kind: 'step',
      kicker: 'Step 1',
      title: 'Read it. What is it asking?',
      num: 1,
      accent: '#1d4ed8',
      whyBg: '#e6eeff',
      body:
        '<p>It wants the <strong>probability of getting a vowel tile</strong>, written as a fraction, a decimal and a percent.</p>' +
        '<p class="iw-arrow-row"><span class="iw-chip iw-chip-fav">goal: chance of a vowel</span></p>',
      why: 'Saying the goal out loud before touching numbers keeps you from solving the wrong question. Here the goal is "chance of a vowel", not "how many vowels".',
      voice: 'Step 1. Read it. What is it asking? It wants the probability of getting a vowel tile, written as a fraction, a decimal, and a percent.',
      work: '<span class="iw-chip iw-chip-fav iw-chip-sm">goal: P(vowel)</span>'
    },
    {
      kind: 'step',
      kicker: 'Step 2',
      title: 'Givens and keywords',
      num: 2,
      accent: '#0f7a3d',
      whyBg: '#e3f6ea',
      body:
        '<div class="iw-chips">' +
        '<span class="iw-chip iw-chip-fav">want: ' + F('20') + ' vowel tiles</span>' +
        '<span class="iw-chip iw-chip-tot">total: ' + Tot('50') + ' tiles</span>' +
        '</div>' +
        '<p style="text-align:center">Keyword: <strong>probability</strong> → build ' + fracFavPoss + '.</p>',
      why: 'A <strong>favorable outcome</strong> is the result you\'re hoping for (a vowel). The <strong>possible outcomes</strong> are every tile you could pull (all ' + Tot('50') + '). Probability isn\'t on the formula sheet, so you need to remember this one.',
      voice: 'Step 2. Givens and keywords. Want: 20 vowel tiles. Total: 50 tiles. Keyword: probability. That means favorable over possible.',
      work: frac2050
    },
    {
      kind: 'step',
      kicker: 'Step 3',
      title: 'Plan and set up the fraction',
      num: 3,
      accent: '#b42318',
      whyBg: '#fde8e6',
      body:
        row(fracFavPoss, eq(), frac2050) +
        '<div class="iw-arrow-row">' +
        '<span class="iw-chip iw-chip-fav">' + F('20') + '</span>' +
        '<span class="iw-arrow">on top</span>' +
        '<span class="iw-chip iw-chip-tot">' + Tot('50') + '</span>' +
        '<span class="iw-arrow">on bottom</span>' +
        '</div>' +
        '<p>Plan: write the fraction → simplify → decimal → percent.</p>',
      why: 'Every tile has the same chance of being picked, so the chance of a vowel is just "how many vowels" out of "how many tiles". The part you want (' + F('20') + ') goes on <strong>top</strong> and the total (' + Tot('50') + ') goes on the <strong>bottom</strong>.',
      voice: 'Step 3. Plan and set up the fraction. Favorable over possible equals 20 over 50. Part you want on top, total on the bottom.',
      work: frac2050
    },
    {
      kind: 'step',
      kicker: 'Step 4',
      title: 'Simplify the fraction',
      num: 4,
      accent: '#7a3fb3',
      whyBg: '#f1e8fb',
      body:
        '<p>Both ' + F('20') + ' and ' + Tot('50') + ' end in 0, so both can be divided by 10:</p>' +
        /* mul/div / rewrite chain → left to right */
        row(frac2050, eq(), fracMid, eq(), frac25) +
        '<p style="text-align:center">Lowest terms: ' + frac25 + ' (' + F('2') + ' and ' + Tot('5') + ' share no other factor).</p>',
      why: 'Dividing the top and bottom by the <strong>same</strong> number is like cutting a pizza into bigger slices: you have fewer slices, but the same amount of pizza. The value doesn\'t change.',
      voice: 'Step 4. Simplify. Both 20 and 50 divide by 10, so 20 over 50 becomes 2 over 5. That is lowest terms.',
      work: row(frac2050, eq(), frac25) + ' <span class="iw-hl">lowest terms</span>'
    },
    {
      kind: 'step',
      kicker: 'Step 5',
      title: 'Fraction → decimal',
      num: 5,
      accent: '#a35a00',
      whyBg: '#fff1dc',
      body:
        '<p><strong>Way A, make the bottom 10:</strong> ' + Tot('5') + ' × 2 = 10, so multiply top and bottom by 2.</p>' +
        row(frac25, eq(), frac410, eq(), Dec('0.4')) +
        '<p><strong>Way B, long division:</strong> ' + F('2') + ' ÷ ' + Tot('5') + '. 5 doesn\'t go into 2, so write "0." and bring down a zero: 5 goes into 20 four times → ' + Dec('0.4') + '</p>',
      why: 'A fraction bar means "divide". Tenths are the first place after the decimal point, so 4 tenths is written ' + Dec('0.4') + '. Making the bottom 10 or 100 is the fastest hand trick whenever it works.',
      voice: 'Step 5. Fraction to decimal. Two fifths equals 4 tenths, which is 0.4. Or divide 2 by 5 and get the same answer.',
      work: row(frac25, eq(), Dec('0.4'))
    },
    {
      kind: 'step',
      kicker: 'Step 6',
      title: 'Decimal → percent',
      num: 6,
      accent: '#9b1c5a',
      whyBg: '#fce7f1',
      body:
        row(Dec('0.4'), eq(), frac410, eq(), frac40100, eq(), Pct('40%')) +
        '<p style="text-align:center">Shortcut: move the decimal 2 places right. ' + Dec('0.4') + ' → 0.40 → ' + Pct('40%') + '</p>',
      why: '<strong>Percent means "per hundred"</strong>: ' + Pct('40%') + ' is 40 out of every 100. So once the bottom is 100, the top number is the percent.',
      voice: 'Step 6. Decimal to percent. 0.4 is 40 per hundred, so 40 percent. Shortcut: move the decimal point two places to the right.',
      work: Dec('0.4') + ' = ' + Pct('40%')
    },
    {
      kind: 'answer',
      kicker: 'Step 7 (check and answer)',
      title: 'Does it make sense? All three forms?',
      num: 7,
      accent: '#0f7a3d',
      whyBg: '#e3f6ea',
      body:
        '<p>Fewer than half of the tiles are vowels (' + F('20') + ' is less than 25), so the answer should be a little under 50%. <strong>' + Pct('40%') + ' fits.</strong></p>' +
        '<div class="iw-answerbox">Problem 1 answer:' +
        '<div class="iw-forms">' +
        '<span class="iw-chip iw-chip-fav iw-chip-hi">' + frac25 + '</span>' +
        '<span class="iw-chip iw-chip-tot">' + Dec('0.4') + '</span>' +
        '<span class="iw-chip iw-chip-ans">' + Pct('40%') + '</span>' +
        '</div></div>',
      why: 'A quick "is it about right?" check catches upside-down fractions. If you\'d gotten ' + fracUpside + ', that\'s more than 1, and a probability can never be more than 1.',
      voice: 'Step 7. Check. Fewer than half the tiles are vowels, so a little under 50 percent makes sense. 40 percent fits. The answer is two fifths, 0.4, and 40 percent.',
      work: frac25 + ' · ' + Dec('0.4') + ' · ' + Pct('40%')
    }
  ];

  var choices = [
    { id: 'f1', label: '\\(\\dfrac{2}{5}\\)', correct: true },
    { id: 'f2', label: '\\(\\dfrac{1}{5}\\)', correct: false },
    { id: 'd1', label: '0.4', correct: true },
    { id: 'd2', label: '0.2', correct: false },
    { id: 'p1', label: '40%', correct: true },
    { id: 'p2', label: '20%', correct: false }
  ];

  InteractiveWalkthrough.mount(document.getElementById('iw-app'), {
    problem: problemHtml,
    slides: slides,
    choices: choices,
    choiceMode: 'multi',
    buildNotes:
      '<p>Color roles: <strong class="iw-term iw-term-fav">20</strong> (favorable, numerator), ' +
      '<strong class="iw-term iw-term-tot">50</strong> (total, denominator), ' +
      '<strong class="iw-term iw-term-dec">0.4</strong>, <strong class="iw-term iw-term-pct">40%</strong>. ' +
      'Stacked MathJax for fractions (e.g. ' + frac25 + '). Bold + color everywhere.</p>' +
      '<p>FIB multi-select gate; S001 in meta only. Try-first collapses when walkthrough opens.</p>',
    autoplay: true,
    muted: false
  });
});
</script>
</body>
</html>
