<div id="iw-app"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var arrowSvg =
    '<svg width="28" height="14" viewBox="0 0 36 18" aria-hidden="true">' +
    '<path d="M2 9h28M24 3l8 6-8 6" fill="none" stroke="#4a4a5a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var problemHtml =
    '<div data-verbatim="problem">' +
    '<p><strong>Problem 1</strong></p>' +
    '<p>Which of the following expressions is equal to \\(6 - 4(x + 3)\\)?</p>' +
    '<ol class="iw-choices" type="A" style="list-style:upper-alpha;padding-left:1.4em;margin:.4em 0 0">' +
    '<li>\\(4x + 3\\)</li>' +
    '<li>\\(4x - 9\\)</li>' +
    '<li>\\(-4x + 9\\)</li>' +
    '<li>\\(-4x - 6\\)</li>' +
    '</ol>' +
    '</div>' +
    '<span class="iw-nocalc">✋ By hand. No calculator.</span>';

  var slides = [
    {
      kind: 'title',
      kicker: 'Interactive walkthrough',
      title: 'Lesson 6 Algebraic Expressions, page 348, problems 1, walkthrough',
      accent: '#1a1a2e',
      whyBg: '#ececf3',
      body:
        '<div class="iw-goal"><strong>The big idea:</strong> when a number sits in front of parentheses, multiply that number by <em>every</em> term inside. That is the <strong>distributive property</strong>.' +
        '\\[a(b+c)=ab+ac\\]' +
        'A minus sign in front means you are distributing a <strong>negative</strong>.</div>' +
        '<p>You\'ll expand \\(6 - 4(x + 3)\\), combine like terms, and match a choice.</p>' +
        '<p style="margin-top:12px;color:var(--muted);font-size:.92em">The <strong>Problem</strong> stays pinned on the left. <strong>Work so far</strong> builds under it as you go. Tap <strong>Next</strong> after each step.</p>',
      why: 'One idea per slide: markups and voice together, then you pause before the next beat.',
      voice: 'Lesson 6 Algebraic Expressions, page 348, problem 1. When a number sits in front of parentheses, multiply it by every term inside. A minus sign means you are distributing a negative. We will expand 6 minus 4 times open parenthesis x plus 3, combine like terms, and match a choice. Tap Next after each step.'
    },
    {
      kind: 'step',
      kicker: 'Look at the problem',
      title: 'Read the whole problem once',
      accent: '#1a1a2e',
      body:
        '<p>The original problem is pinned on the left so you can glance back anytime.</p>' +
        '<p>Spot the expression to simplify: <span class="iw-hl">\\(6 - 4(x + 3)\\)</span>. Then four answer choices.</p>',
      why: 'Read the whole problem once before touching algebra. You need both the expression and the choices.',
      voice: 'Read the whole problem once. It stays pinned on the left. Spot 6 minus 4 times open parenthesis x plus 3, then the four choices.',
      work: '<em>Read problem</em> — simplify \\(6-4(x+3)\\), match a choice'
    },
    {
      kind: 'step',
      kicker: 'Step 1',
      title: 'Read it. What is it asking?',
      num: 1,
      accent: '#1d4ed8',
      whyBg: '#e6eeff',
      body:
        '<p>It wants an expression <strong>equal to</strong> \\(6 - 4(x + 3)\\) — same value for every \\(x\\), not a number.</p>' +
        '<p class="iw-arrow-row"><span class="iw-chip iw-chip-fav">goal: simplify, then match A–D</span></p>',
      why: 'Saying the goal out loud keeps you from plugging in a random value for \\(x\\). This is an <strong>identity</strong> question: rewrite the expression.',
      voice: 'Step 1. What is it asking? It wants an expression equal to 6 minus 4 times open parenthesis x plus 3. Simplify, then match A through D.',
      work: '<span class="iw-chip iw-chip-fav iw-chip-sm">goal: simplify → match</span>'
    },
    {
      kind: 'step',
      kicker: 'Step 2',
      title: 'Givens and keywords',
      num: 2,
      accent: '#0f7a3d',
      whyBg: '#e3f6ea',
      body:
        '<div class="iw-chips">' +
        '<span class="iw-chip iw-chip-tot">outside: 6</span>' +
        '<span class="iw-arrow">then ' + arrowSvg + '</span>' +
        '<span class="iw-chip iw-chip-fav">\\(-4(x+3)\\)</span>' +
        '</div>' +
        '<p style="text-align:center">Keyword: the minus before the 4 means distribute <strong>negative 4</strong>, not positive 4.</p>',
      why: 'Kaplan\'s tip: treat a subtraction in front of parentheses as adding a negative. So \\(6 - 4(x+3)\\) is the same as \\(6 + (-4)(x+3)\\).',
      voice: 'Step 2. Givens and keywords. You have a 6 outside, then minus 4 times the parentheses. That minus means distribute negative 4, not positive 4.',
      work: '<span class="iw-chip iw-chip-tot iw-chip-sm">6</span> + <span class="iw-chip iw-chip-fav iw-chip-sm">\\((-4)(x+3)\\)</span>'
    },
    {
      kind: 'step',
      kicker: 'Step 3',
      title: 'Plan: rewrite the minus, then distribute',
      num: 3,
      accent: '#b42318',
      whyBg: '#fde8e6',
      body:
        '<p class="big">\\[6 - 4(x + 3) = 6 + (-4)(x + 3)\\]</p>' +
        '<div class="iw-arrow-row">' +
        '<span class="iw-chip iw-chip-fav">plan</span>' +
        '<span class="iw-arrow">rewrite ' + arrowSvg + '</span>' +
        '<span class="iw-chip iw-chip-tot">distribute \\(-4\\)</span>' +
        '<span class="iw-arrow">then ' + arrowSvg + '</span>' +
        '<span class="iw-chip iw-chip-ans">combine like terms</span>' +
        '</div>',
      why: 'Order of operations says parentheses first — but here the parentheses hold two terms you cannot add yet. So you <strong>clear</strong> them with the distributive property, then combine.',
      voice: 'Step 3. Plan. Rewrite the minus as plus negative 4 times the parentheses. Then distribute negative 4, then combine like terms.',
      work: '\\(6+(-4)(x+3)\\) → distribute → combine'
    },
    {
      kind: 'step',
      kicker: 'Step 4',
      title: 'Distribute \\(-4\\) to each term inside',
      num: 4,
      accent: '#7a3fb3',
      whyBg: '#f1e8fb',
      body:
        '<p>Multiply \\(-4\\) by \\(x\\) and by \\(3\\):</p>' +
        '<p class="big">\\[(-4)(x + 3) = (-4)(x) + (-4)(3) = -4x + (-12)\\]</p>' +
        '<p style="text-align:center">So the whole expression is <span class="iw-hl">\\(6 + (-4x) + (-12)\\)</span>.</p>',
      why: 'Distributive property: \\(a(b+c)=ab+ac\\). Here \\(a=-4\\), \\(b=x\\), \\(c=3\\). Both products keep the negative from \\(-4\\).',
      voice: 'Step 4. Distribute negative 4. Negative 4 times x is negative 4x. Negative 4 times 3 is negative 12. The expression is now 6 plus negative 4x plus negative 12.',
      work: '\\((-4)(x)+(-4)(3)=-4x-12\\)'
    },
    {
      kind: 'step',
      kicker: 'Step 5',
      title: 'Combine like terms',
      num: 5,
      accent: '#a35a00',
      whyBg: '#fff1dc',
      body:
        '<p>The \\(x\\) term stands alone. The constants are \\(6\\) and \\(-12\\):</p>' +
        '<p class="big">\\[6 + (-4x) + (-12) = -4x + (6 - 12) = -4x - 6\\]</p>' +
        '<p style="text-align:center">Simplified: <span class="iw-circ" style="font-size:.9em;min-width:auto;padding:4px 12px">\\(-4x - 6\\)</span></p>',
      why: 'Like terms have the same variable to the same power. Constants are like terms with each other. You cannot combine \\(-4x\\) with \\(-6\\) — different kinds of terms.',
      voice: 'Step 5. Combine like terms. Six and negative twelve make negative six. The x term stays. You get negative 4x minus 6.',
      work: '\\(-4x-6\\) <span class="iw-hl">simplified</span>'
    },
    {
      kind: 'step',
      kicker: 'Step 6',
      title: 'Match the choices',
      num: 6,
      accent: '#9b1c5a',
      whyBg: '#fce7f1',
      body:
        '<p>Look for \\(-4x - 6\\) in the list:</p>' +
        '<ul style="margin:.4em 0;padding-left:1.2em;line-height:1.7">' +
        '<li>A. \\(4x + 3\\) — wrong signs</li>' +
        '<li>B. \\(4x - 9\\) — distributed positive 4 by mistake</li>' +
        '<li>C. \\(-4x + 9\\) — combined constants as \\(6+3\\) instead of \\(6-12\\)</li>' +
        '<li><strong>D. \\(-4x - 6\\)</strong> — matches</li>' +
        '</ul>',
      why: 'Common traps: forgetting the minus on the 4 (choice B), or distributing only to the first term inside the parentheses (choice C-style mistakes).',
      voice: 'Step 6. Match the choices. A and B have the wrong sign on the x term. C has the wrong constant. D is negative 4x minus 6. That matches.',
      work: '<span class="iw-chip iw-chip-ans iw-chip-sm">matches D</span>'
    },
    {
      kind: 'answer',
      kicker: 'Step 7 — check and answer',
      title: 'Does it make sense?',
      num: 7,
      accent: '#0f7a3d',
      whyBg: '#e3f6ea',
      body:
        '<p>Quick check: plug in \\(x=0\\). Original: \\(6 - 4(0+3)=6-12=-6\\). Choice D: \\(-4(0)-6=-6\\). Same.</p>' +
        '<div class="iw-answerbox">Problem 1 answer:' +
        '<div class="iw-forms">' +
        '<span class="iw-chip iw-chip-ans iw-chip-hi">D. \\(-4x - 6\\)</span>' +
        '</div></div>',
      why: 'A single test value will not prove two expressions are always equal, but it quickly catches arithmetic slips before you bubble the answer.',
      voice: 'Step 7. Check. When x is 0, both the original and choice D equal negative 6. The answer is D, negative 4x minus 6.',
      work: '<span class="iw-chip iw-chip-ans iw-chip-sm">D. \\(-4x-6\\)</span>'
    }
  ];

  InteractiveWalkthrough.mount(document.getElementById('iw-app'), {
    problem: problemHtml,
    slides: slides,
    autoplay: true,
    muted: false
  });
});
</script>
